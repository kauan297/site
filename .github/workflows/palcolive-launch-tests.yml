name: PalcoLive launch safety tests

on:
  push:
    branches:
      - palcolive-lancamento-preparo-20261010
      - lunadance-server
      - palcolive-backup-preparo-20261010
  pull_request:
    branches:
      - lunadance-server

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check syntax
        run: |
          node --check server.js
          node --check sales-visits.js
          node --check public/visits.js
          node --check public/admin.js
          node --check sales-gate.js
          node --check kiwify-auto.js
          node --check cakto-auto.js
          node --check public/vendas.js
          node --check public/app.js
          node --check kiwify-delivery.js
          node --check legacy-db-audit.js
      - name: Test sales security
        run: |
          node tests/sales-gate.test.cjs
          node tests/sales-frontend.test.cjs
          node tests/sales-visits.test.cjs
          node tests/kiwify-short-token.test.cjs
          node tests/kiwify-storage-preflight.test.cjs
          node tests/legacy-db-audit.test.cjs
      - name: Test Kiwify activation and refunds
        run: |
          node tests/kiwify-auto.test.cjs
          node tests/cakto-auto.test.cjs
      - name: Test encrypted license backup and safe restore
        run: node tests/license-backup.test.cjs
      - name: Test Roblox and mobile recovery panel
        run: node tests/stability.test.cjs

  backup-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: palcolive_disposable_test
          POSTGRES_USER: palcolive_test
          POSTGRES_PASSWORD: disposable-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test backup and restore against disposable PostgreSQL
        env:
          PALCOLIVE_DISPOSABLE_DATABASE: '1'
          TEST_DATABASE_URL: postgresql://palcolive_test:disposable-test-only@localhost:5432/palcolive_disposable_test
        run: node tests/license-backup-postgres.test.cjs
      - name: Test concurrent activation, transfer, refunds and email recovery
        env:
          PALCOLIVE_DISPOSABLE_DATABASE: '1'
          TEST_DATABASE_URL: postgresql://palcolive_test:disposable-test-only@localhost:5432/palcolive_disposable_test
        run: node tests/purchase-postgres.test.cjs


      - name: Test Cakto concurrent activation and refunds
        env:
          PALCOLIVE_DISPOSABLE_DATABASE: '1'
          TEST_DATABASE_URL: postgresql://palcolive_test:disposable-test-only@localhost:5432/palcolive_disposable_test
        run: node tests/cakto-postgres.test.cjs
      - name: Test durable aggregate visit counters
        env:
          PALCOLIVE_DISPOSABLE_DATABASE: '1'
          TEST_DATABASE_URL: postgresql://palcolive_test:disposable-test-only@localhost:5432/palcolive_disposable_test
        run: node tests/sales-visits-postgres.test.cjs
