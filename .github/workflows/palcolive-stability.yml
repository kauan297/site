name: PalcoLive - stability checks

on:
  push:
    branches:
      - palcolive-estabilidade-20261010
  pull_request:
    branches:
      - lunadance-server

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: |
          node --check public/app.js
          node --check server.js
          node --check public/sw.js
      - name: Test PC, mobile and stage recovery
        run: node tests/stability.test.cjs
